[project]
name = "SM-API-Gateway"
version = "2.0.0"
description = "企业 API 网关：路由、鉴权、限流、熔断、灰度与请求审计"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
